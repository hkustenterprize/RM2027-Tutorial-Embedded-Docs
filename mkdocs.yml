site_name: HKUST ENTERPRIZE Embedded Tutorial Site
site_description: RM Embedded Tutorial docs
site_url: https://tutorial.robomaster.hk/
repo_name: hkustenterprize/RM2027-Tutorial-Embedded-Docs
repo_url: https://github.com/hkustenterprize/RM2027-Tutorial-Embedded-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/enterprize-logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页:
      - index.md
      - 环境配置:
          - Environment/index.md
          - Windows: "Environment/Windows/RM Embedded Tutorial 环境配置 Windows.md"
          - macOS: "Environment/macOS/RM Embedded Tutorial 环境配置 macOS.md"
          - Linux: "Environment/Linux/RM Embedded Tutorial 环境配置 Linux.md"
          - 环境验证: "Environment/Verify/RM Embedded Tutorial 环境验证.md"

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
